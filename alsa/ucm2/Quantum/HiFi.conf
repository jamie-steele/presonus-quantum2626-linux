# HiFi.conf
# Specific configuration for PreSonus Quantum

Define.INPUT_CHANNELS 26
Define.OUTPUT_CHANNELS 32
Define.RATE 48000

Include.common.File "/Quantum/Common.conf"

# --- OUTPUTS ---

SectionDevice."Out1" {
	Comment "Main OUT 1/2"
	Macro.pair.QuantumPlaybackPair {
		Priority 1000
		Channel0 0
		Channel1 1
	}
}

SectionDevice."Out2" {
	Comment "Line OUT 1/2"
	Macro.pair.QuantumPlaybackPair {
		Priority 1000
		Channel0 2
		Channel1 3
	}
}

SectionDevice."Out3" {
	Comment "Line OUT 3/4"
	Macro.pair.QuantumPlaybackPair {
		Priority 900
		Channel0 4
		Channel1 5
	}
}

SectionDevice."Out4" {
	Comment "Line OUT 5/6"
	Macro.pair.QuantumPlaybackPair {
		Priority 800
		Channel0 6
		Channel1 7
	}
}

SectionDevice."Out5" {
	Comment "Line OUT 7/8"
	Macro.pair.QuantumPlaybackPair {
		Priority 800
		Channel0 8
		Channel1 9
	}
}

SectionDevice."Out6" {
	Comment "Phones OUT 1"
	Macro.pair.QuantumPlaybackPair {
		Priority 800
		Channel0 10
		Channel1 11
	}
}

SectionDevice."Out7" {
	Comment "Phones OUT 2"
	Macro.pair.QuantumPlaybackPair {
		Priority 800
		Channel0 12
		Channel1 13
	}
}

SectionDevice."Out8" {
	Comment "SPDIF OUT"
	Macro.pair.QuantumPlaybackPair {
		Priority 800
		Channel0 14
		Channel1 15
	}
}


SectionDevice."Out5" {
	Comment "ADAT OUT 1/2"
	Macro.pair.QuantumPlaybackPair {
		Priority 700
		Channel0 16
		Channel1 17
	}
}

