# Ported Wirplumber 0.4 LUA script to 0.5 configuration format
# See: https://pipewire.pages.freedesktop.org/wireplumber/daemon/configuration/migration.html
# Keep the proven 128-frame Quantum hardware period while providing
# four periods of buffering for the shared UCM playback and capture nodes.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*.HiFi__quantum_stereo_out_*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.period-size = 128
        api.alsa.period-num = 4
      }
    }
  },
  {
    matches = [
      {
        node.name = "~alsa_input.*.HiFi__quantum_mono_in_*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.period-size = 128
        api.alsa.period-num = 4
      }
    }
  }
]