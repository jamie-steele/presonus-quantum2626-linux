# Common.conf
# Shared logic for PreSonus Quantum Thunderbolt Family
# These variables MUST be defined in files including this script:
# - Define.INPUT_CHANNELS (ex: 26)
# - Define.OUTPUT_CHANNELS (ex: 26)
# - Define.RATE (ex: 48000)

Define.PERIOD_SIZE 128
Define.PERIODS 4

# ------------------------------------------------------------------
# Shared PCM definition (dshare/dsnoop)
# ------------------------------------------------------------------

# One shared hardware stream backs every playback pair and mono capture source.
# Keep this geometry synchronized with driver/snd-quantum.c.
LibraryConfig.pcm.SubstiConfig.pcm.quantum_stereo_out {
	@args [ CARD DEV CHN0 CHN1 TOTAL_CHN ]
	@args {
		CARD.type string
		DEV.type integer
		CHN0.type integer
		CHN1.type integer
		TOTAL_CHN.type integer
	}

	type dshare
	ipc_key 262600
	ipc_key_add_uid true

	slave {
		pcm {
			type hw
			card $CARD
			device $DEV
		}
		format S32_LE
		rate $RATE
		channels $TOTAL_CHN
		period_size $PERIOD_SIZE
		periods $PERIODS
	}

	bindings.0 $CHN0
	bindings.1 $CHN1
}

LibraryConfig.pcm.SubstiConfig.pcm.quantum_mono_in {
	@args [ CARD DEV CHN TOTAL_CHN ]
	@args {
		CARD.type string
		DEV.type integer
		CHN.type integer
		TOTAL_CHN.type integer
	}

	type dsnoop
	ipc_key 262601
	ipc_key_add_uid true

	slave {
		pcm {
			type hw
			card $CARD
			device $DEV
		}
		format S32_LE
		rate $RATE
		channels $TOTAL_CHN
		period_size $PERIOD_SIZE
		periods $PERIODS
	}

	bindings.0 $CHN
}

# ------------------------------------------------------------------
# Device generation macros
# ------------------------------------------------------------------

DefineMacro.QuantumPlaybackPair {
	Value {
		PlaybackPriority "${var:__Priority}"
		PlaybackChannels 2
		PlaybackPCM "quantum_stereo_out:${CardId},0,${var:__Channel0},${var:__Channel1},${var:OUTPUT_CHANNELS}"
	}
}

DefineMacro.QuantumCaptureChannel {
	Value {
		CapturePriority "${var:__Priority}"
		CaptureChannels 1
		CapturePCM "quantum_mono_in:${CardId},0,${var:__Channel},${var:INPUT_CHANNELS}"
	}
}
