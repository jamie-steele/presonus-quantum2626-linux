# One shared hardware stream backs every playback pair and mono capture source.
# Keep this geometry synchronized with driver/snd-quantum.c.
LibraryConfig.pcm.SubstiConfig.pcm.quantum2626_stereo_out {
	@args [ CARD DEV CHN0 CHN1 ]
	@args {
		CARD.type string
		DEV.type integer
		CHN0.type integer
		CHN1.type integer
	}

	type dshare
	ipc_key 262600
	ipc_key_add_uid true
	slowptr true

	slave {
		pcm {
			type hw
			card $CARD
			device $DEV
		}
		format S32_LE
		rate 44100
		channels 26
		period_size 128
		periods 4
	}

	bindings.0 $CHN0
	bindings.1 $CHN1
}

LibraryConfig.pcm.SubstiConfig.pcm.quantum2626_mono_in {
	@args [ CARD DEV CHN ]
	@args {
		CARD.type string
		DEV.type integer
		CHN.type integer
	}

	type dsnoop
	ipc_key 262601
	ipc_key_add_uid true

	slave {
		pcm {
			type hw
			card $CARD
			device $DEV
		}
		format S32_LE
		rate 44100
		channels 26
		period_size 128
		periods 4
	}

	bindings.0 $CHN
}

DefineMacro.Quantum2626PlaybackPair {
	Value {
		PlaybackPriority "${var:__Priority}"
		PlaybackChannels 2
		PlaybackPCM "quantum2626_stereo_out:${var:QuantumCard},0,${var:__Channel0},${var:__Channel1}"
	}
}

DefineMacro.Quantum2626CaptureChannel {
	Value {
		CapturePriority "${var:__Priority}"
		CaptureChannels 1
		CapturePCM "quantum2626_mono_in:${var:QuantumCard},0,${var:__Channel}"
	}
}

