# --- INPUTS ---

SectionDevice."In1" {
	Comment "Mic/Line/Inst In 1"
	Macro.channel.QuantumCaptureChannel {
		Priority 1000
		Channel 0
	}
}

SectionDevice."In2" {
	Comment "Mic/Line/Inst In 2"
	Macro.channel.QuantumCaptureChannel {
		Priority 1000
		Channel 1
	}
}

SectionDevice."In3" {
	Comment "Mic/Line In 3"
	Macro.channel.QuantumCaptureChannel {
		Priority 900
		Channel 2
	}
}

SectionDevice."In4" {
	Comment "Mic/Line In 4"
	Macro.channel.QuantumCaptureChannel {
		Priority 900
		Channel 3
	}
}

SectionDevice."In5" {
	Comment "Mic/Line In 5"
	Macro.channel.QuantumCaptureChannel {
		Priority 900
		Channel 4
	}
}
SectionDevice."In6" {
	Comment "Mic/Line In 6"
	Macro.channel.QuantumCaptureChannel {
		Priority 900
		Channel 5
	}
}
SectionDevice."In7" {
	Comment "Mic/Line In 7"
	Macro.channel.QuantumCaptureChannel {
		Priority 900
		Channel 6
	}
}

SectionDevice."In8" {
	Comment "Mic/Line In 8"
	Macro.channel.QuantumCaptureChannel {
		Priority 900
		Channel 7
	}
}

SectionDevice."In9" {
	Comment "SPDIF In L"
	Macro.channel.QuantumCaptureChannel {
		Priority 800
		Channel 8
	}
}

SectionDevice."In10" {
	Comment "SPDIF In R"
	Macro.channel.QuantumCaptureChannel {
		Priority 800
		Channel 9
	}
}

SectionDevice."In11" {
	Comment "ADAT Input 1"
	Macro.channel.QuantumCaptureChannel {
		Priority 500
		Channel 10
	}
}

SectionDevice."In12" {
	Comment "ADAT Input 2"
	Macro.channel.QuantumCaptureChannel {
		Priority 500
		Channel 11
	}
}

